[highlight]
  noClasses = false
  codeFences = true
  lineNos = true
  lineNumbersInTable = true

[tableOfContents]
  startLevel = 2
  endLevel = 4

[goldmark.extensions.passthrough]
  enable = true

  [goldmark.extensions.passthrough.delimiters]
    block = [['\[', '\]'], ['$$', '$$']]
    inline = [['\(', '\)'], ['$', '$']]