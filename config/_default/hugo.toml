baseURL = "https://dogdreamson555.github.io/"
title = "dogdreamson555 的博客"
theme = "hugo-theme-stack"
defaultContentLanguage = "zh"
locale = "zh-CN"
hasCJKLanguage = true
timeZone = "Asia/Shanghai"
buildDrafts = false
buildFuture = false
buildExpired = false

[pagination]
  pagerSize = 10

[permalinks]
  post = "/p/:slug/"
  page = "/:slug/"

[[menus.main]]
  identifier = "home"
  name = "首页"
  pageRef = "/"
  weight = 1
  [menus.main.params]
    icon = "home"

[[menus.main]]
  identifier = "categories-tags"
  name = "分类与标签"
  pageRef = "/page/categories-tags"
  weight = 2
  [menus.main.params]
    icon = "categories"

[[menus.main]]
  identifier = "archives"
  name = "归档"
  pageRef = "/page/archives"
  weight = 3
  [menus.main.params]
    icon = "archives"

[[menus.main]]
  identifier = "search"
  name = "搜索"
  pageRef = "/page/search"
  weight = 4
  [menus.main.params]
    icon = "search"
