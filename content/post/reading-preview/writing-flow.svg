<svg xmlns="http://www.w3.org/2000/svg" width="960" height="320" viewBox="0 0 960 320" role="img" aria-labelledby="title desc">
  <title id="title">写作流程示意图</title>
  <desc id="desc">三个步骤从左到右排列：编写 Markdown、本地预览、公开内容检查。</desc>
  <rect width="960" height="320" rx="20" fill="#f1f5f9"/>
  <g fill="#ffffff" stroke="#64748b" stroke-width="2">
    <rect x="40" y="90" width="240" height="140" rx="12"/>
    <rect x="360" y="90" width="240" height="140" rx="12"/>
    <rect x="680" y="90" width="240" height="140" rx="12"/>
  </g>
  <g fill="none" stroke="#334155" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M300 160h40m-12-12 12 12-12 12"/>
    <path d="M620 160h40m-12-12 12 12-12 12"/>
  </g>
  <g fill="#0f172a" text-anchor="middle" font-family="sans-serif">
    <text x="160" y="145" font-size="20">01</text>
    <text x="480" y="145" font-size="20">02</text>
    <text x="800" y="145" font-size="20">03</text>
    <text x="160" y="185" font-size="26">编写 Markdown</text>
    <text x="480" y="185" font-size="26">本地预览</text>
    <text x="800" y="185" font-size="26">公开内容检查</text>
  </g>
</svg>
