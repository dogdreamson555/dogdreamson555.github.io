name: Build and deploy Hugo to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    env:
      TZ: Asia/Shanghai
      # SHA-256 of the official Hugo Extended 0.165.0 Linux amd64 archive.
      # Update together with .hugo-version when intentionally upgrading Hugo.
      HUGO_SHA256: f43494894cdf4a8630a201d5c828051c77f523cc66bb3938b30806835470ac20
    steps:
      - name: Checkout source and pinned theme
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Install pinned Hugo Extended
        run: |
          HUGO_VERSION="$(tr -d '\r\n' < .hugo-version)"
          archive="hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          curl --fail --location --retry 3 \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/${archive}" \
            --output "${RUNNER_TEMP}/${archive}"
          printf '%s  %s\n' "$HUGO_SHA256" "${RUNNER_TEMP}/${archive}" | sha256sum --check
          mkdir -p "${RUNNER_TEMP}/hugo-bin"
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}/hugo-bin" hugo
          echo "${RUNNER_TEMP}/hugo-bin" >> "$GITHUB_PATH"
          "${RUNNER_TEMP}/hugo-bin/hugo" version

      - name: Build production site into a fresh directory
        id: build
        env:
          SITE_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          destination="$(mktemp -d "${RUNNER_TEMP}/hugo-public.XXXXXX")"
          hugo --environment production --minify \
            --baseURL "${SITE_BASE_URL%/}/" \
            --cacheDir "${RUNNER_TEMP}/hugo-cache" \
            --destination "$destination"
          echo "destination=$destination" >> "$GITHUB_OUTPUT"

      - name: Upload generated site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ steps.build.outputs.destination }}
          include-hidden-files: false

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
