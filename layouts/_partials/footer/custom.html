{{- /* Keep only the active table-of-contents branch expanded. */ -}}
{{- $particlesScript := resources.Get "background/particles/particles.js" | resources.Minify | fingerprint -}}
{{- $particlesConfig := resources.Get "background/particles/particlesjs-config.json" | fingerprint -}}

<script>
    (() => {
        const toc = document.querySelector('#TableOfContents');
        if (!toc) {
            return;
        }

        const childListSelector = ':scope > ul, :scope > ol';
        let framePending = false;

        const syncExpandedBranch = () => {
            framePending = false;

            const activeItem = toc.querySelector('li.active-class');
            const expandedItems = new Set();
            let item = activeItem;

            while (item instanceof HTMLElement && item.closest('#TableOfContents') === toc) {
                if (item.matches('li') && item.querySelector(childListSelector)) {
                    expandedItems.add(item);
                }
                item = item.parentElement?.closest('li');
            }

            toc.querySelectorAll('li.toc-expanded').forEach((entry) => {
                if (!expandedItems.has(entry)) {
                    entry.classList.remove('toc-expanded');
                }
            });

            expandedItems.forEach((entry) => {
                entry.classList.add('toc-expanded');
            });
        };

        const scheduleSync = () => {
            if (framePending) {
                return;
            }

            framePending = true;
            window.requestAnimationFrame(syncExpandedBranch);
        };

        window.addEventListener('scroll', scheduleSync, { passive: true });
        window.addEventListener('resize', scheduleSync);

        // Stack adds active-class from its own scrollspy. Watching the class
        // also handles anchor jumps and programmatic scrolling.
        const observer = new MutationObserver(scheduleSync);
        observer.observe(toc, {
            subtree: true,
            attributes: true,
            attributeFilter: ['class'],
        });

        syncExpandedBranch();
        window.addEventListener('load', () => window.setTimeout(syncExpandedBranch, 50), { once: true });
    })();
</script>

<button class="back-to-top" id="back-to-top" type="button" aria-label="返回顶部" title="返回顶部" aria-hidden="true" tabindex="-1">
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="m5 11 7-7 7 7M12 5v15" />
    </svg>
</button>
<script>
    (() => {
        const button = document.querySelector('#back-to-top');
        if (!button) {
            return;
        }

        const scrollThreshold = 20;

        const syncVisibility = () => {
            const isVisible = window.scrollY > scrollThreshold;
            button.classList.toggle('is-visible', isVisible);
            button.setAttribute('aria-hidden', String(!isVisible));
            button.tabIndex = isVisible ? 0 : -1;
        };

        button.addEventListener('click', () => {
            const reduceMotion = window.matchMedia?.('(prefers-reduced-motion: reduce)').matches ?? false;
            window.scrollTo({ top: 0, behavior: reduceMotion ? 'auto' : 'smooth' });
        });

        window.addEventListener('scroll', syncVisibility, { passive: true });
        syncVisibility();
    })();
</script>

<div id="particles-js" aria-hidden="true"></div>
<script src="{{ $particlesScript.RelPermalink }}"></script>
<script>
    (() => {
        if (typeof window.particlesJS?.load !== 'function') {
            return;
        }

        window.particlesJS.load('particles-js', '{{ $particlesConfig.RelPermalink }}');
    })();
</script>
